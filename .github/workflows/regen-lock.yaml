# temporary: regenerates package-lock.json with the runner's npm, then gets deleted
name: Regenerate lockfile
"on":
  push:
    branches: [ci/build-check]
    paths: [.github/workflows/regen-lock.yaml]
permissions:
  contents: write
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: sync package-lock.json with package.json"
          git push
